# cmp-bar1-repair: restore the CMP 170HX 64 GiB BAR1 vendor override before the
# nvidia module loads (ESXi passthrough resets it at every VM power-on).
# The tool is idempotent, writes only a card that is exactly in the reset
# profile with a 64 GiB host BAR1, and always exits 0, so the driver load
# never depends on it.  To disable: delete this file.
# Docs: README.md next to the hook source
install nvidia /usr/local/sbin/cmp-bar1-repair; /sbin/modprobe --ignore-install nvidia $CMDLINE_OPTS
